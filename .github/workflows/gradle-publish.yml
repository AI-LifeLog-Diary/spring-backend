name: Java CI with Gradle

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create application-prod.yml
        run: |
          cat <<EOF > ./src/main/resources/application-prod.yml
          ${{ secrets.APPLICATION_PROD }}
          EOF
      
      - name: Create Apple .p8 key file
        run: |
          mkdir -p ./src/main/resources/key
          echo "${{ secrets.APPLE_P8_KEY }}" > ./src/main/resources/key/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      # Docker build & Push
      - name: Docker build
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker build -t app .
          docker tag app ${{ secrets.DOCKERHUB_USERNAME }}/moai-spring-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/moai-spring-backend:latest

      # Deploy repo trigger
      - name: Trigger deploy repo workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          repository: AI-LifeLog-Diary/moai-deploy
          event-type: deploy
